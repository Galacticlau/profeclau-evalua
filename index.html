function go(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+v));render();window.scrollTo(0,0)}
function courses(){return data.courses}function rubrics(){return data.rubrics}function byId(a,k){return a.find(x=>x.id===k)}
function render(){const app=$('app');if(view==='home')app.innerHTML=homeHTML();if(view==='courses')app.innerHTML=coursesHTML();if(view==='rubrics')app.innerHTML=rubricsHTML();if(view==='history')app.innerHTML=historyHTML();if(view==='groups')app.innerHTML=groupsHTML();if(view==='evaluate')app.innerHTML=evaluateHTML();if(view==='results')app.innerHTML=resultsHTML();}
function homeHTML(){return `<div class="stack"><section class="panel"><span class="eyebrow">Tu espacio de evaluación</span><h1 class="heading">Evalúa sin perder el ritmo de la clase.</h1><p class="muted">Carga una vez tus cursos y reutilízalos en todas tus actividades. Importa distintas pautas, evalúa por equipos y obtén notas con exigencia del 60 %.</p><div class="grid3"><div class="tile"><strong>${courses().length}</strong><span>Cursos</span></div><div class="tile"><strong>${rubrics().length}</strong><span>Pautas</span></div><div class="tile"><strong>${data.sessions.length}</strong><span>Evaluaciones</span></div></div><div class="actions"><button class="btn primary" onclick="startDialog()">＋ Nueva evaluación</button><button class="btn soft" onclick="go('courses')">Gestionar cursos</button></div></section><section class="panel"><h2 class="section-title">Evaluaciones recientes</h2>${data.sessions.length?data.sessions.slice().reverse().slice(0,6).map(s=>{let c=byId(courses(),s.courseId),r=byId(rubrics(),s.rubricId);return `<div class="item"><div><div class="itemname">${esc(s.group)}</div><div class="small">${esc(c?.name||s.courseName||'Curso')} · ${esc(r?.name||s.rubricName||'Pauta')}</div></div><button class="btn outline" onclick="openSession('${s.id}')">Abrir</button></div>`}).join(''):`<div class="empty">Aún no hay evaluaciones guardadas.</div>`}</section><section class="panel"><h2 class="section-title">Respaldo y portabilidad</h2><p class="muted">La información persiste en este navegador, pero no se sincroniza entre dispositivos. Para llevarla a otro celular, exporta e importa un respaldo JSON.</p><div class="actions"><button class="btn soft" onclick="backup()">↓ Descargar respaldo</button><label class="btn outline filelabel">↑ Restaurar respaldo<input type="file" accept=".json,application/json" onchange="restoreBackup(event)"></label></div></section></div>`}
function coursesHTML(){return `<div class="stack"><section class="panel"><span class="eyebrow">Estudiantes</span><h1 class="heading">Mis cursos</h1><p class="muted">Cada curso se importa una sola vez. Si vuelves a abrir la aplicación en este mismo navegador, seguirá disponible.</p><div class="actions"><label class="btn primary filelabel">＋ Importar curso CSV<input type="file" accept=".csv,text/csv" onchange="importCourse(event)"></label><button class="btn soft" onclick="downloadSample('course')">↓ CSV de ejemplo</button></div><div class="help" style="margin-top:14px">Columnas: <b>Nombre, Grupo, Correo</b>. También acepta <b>Mail</b> y, opcionalmente, <b>Curso</b>. Si incluyes Curso, separará la nómina en cursos distintos.</div></section><section class="panel"><h2 class="section-title">Cursos guardados</h2>${courses().length?courses().map(c=>`<div class="item"><div><div class="itemname">${esc(c.name)}</div><div class="small">${c.students.length} estudiantes · ${unique(c.students.map(s=>s.grupo)).length} grupos</div></div><div class="actions"><button class="btn outline" onclick="viewCourse('${c.id}')">Ver</button><button class="btn danger" onclick="removeCourse('${c.id}')">Eliminar</button></div></div>`).join(''):`<div class="empty">Todavía no has importado cursos.</div>`}</section></div>`}
function rubricsHTML(){return `<div class="stack"><section class="panel"><span class="eyebrow">Instrumentos</span><h1 class="heading">Mis pautas</h1><p class="muted">Sube una pauta distinta para cada actividad; la app convertirá cada fila en un criterio de evaluación.</p><div class="actions"><label class="btn primary filelabel">＋ Importar pauta CSV<input type="file" accept=".csv,text/csv" onchange="importRubric(event)"></label><button class="btn soft" onclick="downloadSample('rubric')">↓ CSV de ejemplo</button></div><div class="help" style="margin-top:14px"><b>Seccion, Criterio, Modalidad, PuntajeMaximo</b>. Modalidad: <b>Individual</b> o <b>Grupal</b>. Los valores 0–4 del desempeño se convierten proporcionalmente al máximo de cada indicador.</div></section><section class="panel"><h2 class="section-title">Pautas guardadas</h2>${rubrics().length?rubrics().map(r=>`<div class="item"><div><div class="itemname">${esc(r.name)}</div><div class="small">${r.criteria.length} criterios · ${maxScore(r)} puntos</div></div><div class="actions"><button class="btn outline" onclick="viewRubric('${r.id}')">Ver</button><button class="btn danger" onclick="removeRubric('${r.id}')">Eliminar</button></div></div>`).join(''):`<div class="empty">No hay pautas.</div>`}</section></div>`}
function historyHTML(){return `<div class="stack"><section class="panel"><span class="eyebrow">Seguimiento</span><h1 class="heading">Resultados guardados</h1><div class="actions"><button class="btn primary" onclick="exportResults(false)">↓ Descargar resumen CSV</button><button class="btn soft" onclick="exportResults(true)">↓ Detalle de criterios CSV</button></div><p class="muted">Puedes volver a las evaluaciones para corregir sus puntajes.</p></section><section class="panel">${data.sessions.length?data.sessions.slice().reverse().map(s=>`<div class="item"><div><div class="itemname">${esc(s.courseName)} · ${esc(s.group)}</div><div class="small">${esc(s.rubricName)} · ${new Date(s.created).toLocaleDateString('es-CL')}</div></div><button class="btn outline" onclick="openSession('${s.id}')">Abrir</button></div>`).join(''):`<div class="empty">Sin evaluaciones todavía.</div>`}</section></div>`}
function maxScore(r){return r.criteria.reduce((n,c)=>n+Number(c.maximo),0)}
function startDialog(){if(!courses().length||!rubrics().length){toast('Primero importa un curso y una pauta.');return}showModal(`<h3>Nueva evaluación</h3><p class="muted">Selecciona el curso y la pauta que usarás.</p><div class="field"><label>Curso</label><select id="choose-course">${courses().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Pauta</label><select id="choose-rubric">${rubrics().map(r=>`<option value="${r.id}">${esc(r.name)} (${maxScore(r)} pts)</option>`).join('')}</select></div><div class="actions"><button class="btn primary" onclick="selectStart()">Continuar</button><button class="btn soft" onclick="hideModal()">Cancelar</button></div>`)}
function selectStart(){activeCourse=$('choose-course').value;activeRubric=$('choose-rubric').value;hideModal();go('groups')}
function groupsHTML(){let c=byId(courses(),activeCourse),r=byId(rubrics(),activeRubric);if(!c||!r)return `<div class="panel">Curso o pauta no disponible. <button class="btn soft" onclick="go('home')">Volver</button></div>`;let groups=unique(c.students.map(s=>s.grupo));return `<div class="stack"><section class="panel"><button class="crumb" onclick="startDialog()">‹ Cambiar curso o pauta</button><span class="eyebrow" style="display:block;margin-top:8px">${esc(c.name)}</span><h1 class="heading">Elige un grupo</h1><p class="muted">${esc(r.name)} · ${r.criteria.length} indicadores · ${maxScore(r)} puntos. Cada estudiante conservará su emoji durante esta evaluación.</p><div class="groupcards">${groups.map(g=>{let n=c.students.filter(s=>s.grupo===g).length;let done=data.sessions.find(s=>s.courseId===c.id&&s.rubricId===r.id&&s.group===g);return `<button class="group-card" onclick="startGroup('${encodeURIComponent(g)}')"><strong>${esc(g)}</strong><span>${n} estudiantes · ${done?'Continuar ↗':'Comenzar →'}</span></button>`}).join('')}</div></section></div>`}
function startGroup(encoded){let group=decodeURIComponent(encoded),c=byId(courses(),activeCourse),r=byId(rubrics(),activeRubric);let s=data.sessions.find(s=>s.courseId===c.id&&s.rubricId===r.id&&s.group===group);if(!s){let students=c.students.filter(x=>x.grupo===group).map((x,i)=>({...x,uid:id(),emoji:EMOJIS[i%EMOJIS.length]}));s={id:id(),courseId:c.id,courseName:c.name,rubricId:r.id,rubricName:r.name,group,students,criteria:JSON.parse(JSON.stringify(r.criteria)),marks:{},created:new Date().toISOString()};data.sessions.push(s);save()}activeSession=s.id;step=0;go('evaluate')}
function openSession(sid){let s=byId(data.sessions,sid);if(!s)return;activeSession=sid;step=0;go('results')}
function session(){return byId(data.sessions,activeSession)}
function marksFor(s,index){let c=s.criteria[index];return s.students.map(x=>c.modalidad==='Grupal'?(s.marks[index]?.group??null):(s.marks[index]?.[x.uid]??null))}
function evaluateHTML(){let s=session();if(!s)return `<div class="panel">No se encontró la evaluación.</div>`;if(step>=s.criteria.length)return resultsHTML();let c=s.criteria[step],values=marksFor(s,step),grupal=c.modalidad==='Grupal';let done=s.criteria.filter((_,i)=>marksFor(s,i).every(x=>x!==null)).length;return `<div class="stack"><section class="panel"><div class="summarybar"><button class="crumb" onclick="go('results')">‹ Ver resultados</button><span class="tag">${step+1} de ${s.criteria.length}</span></div><div class="small" style="margin-top:8px">${esc(s.courseName)} · ${esc(s.group)}</div><div class="progress"><div style="width:${100*done/s.criteria.length}%"></div></div><div class="criterionbox"><div class="rowwrap"><span class="tag">${esc(c.seccion)}</span><span class="tag ${grupal?'tag-grupal':''}">${grupal?'Grupal':'Individual'} · ${c.maximo} pts</span></div><h2>${esc(c.criterio)}</h2></div>${grupal?`<div class="help">Este criterio es grupal: al elegir un nivel se aplicará a todos los integrantes.</div>`:''}<div class="table-scroll"><table class="evaltable" style="min-width:${grupal?'300px':Math.max(410,150+s.students.length*70)+'px'}"><thead><tr><th><span class="small">Nivel</span></th>${grupal?`<th style="width:auto"><div class="student-head"><span class="emoji">🤝</span><span class="studentname">Todo el grupo</span></div></th>`:s.students.map(x=>`<th><div class="student-head"><span class="emoji">${x.emoji}</span><span class="studentname">${esc(x.nombre.split(' ')[0])}</span></div></th>`).join('')}</tr></thead><tbody>${[['Logrado',4,'Cumple completamente'],['Medianamente logrado',3,'Pequeñas dificultades'],['En desarrollo',2,'Cumple parcialmente'],['Inicial',1,'Evidencia mínima'],['Sin evidencia',0,'No presentado']].map(([name,val,desc])=>`<tr><td><div class="level-name">${name}<small>${desc}</small></div></td>${grupal?`<td><button aria-label="${name}: grupo" class="choose ${values[0]===val?'selected':''}" onclick="markGroup(${val})">🤝</button></td>`:s.students.map((x,i)=>`<td><button aria-label="${name}: ${esc(x.nombre)}" class="choose ${values[i]===val?'selected':''}" onclick="markStudent('${x.uid}',${val})">${x.emoji}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small">${values.filter(x=>x!==null).length}/${values.length} calificados en este criterio · toca el personaje en la fila correspondiente</p></section><div class="sticky-actions"><button class="btn soft" onclick="move(-1)" ${step===0?'disabled':''}>← Anterior</button><button class="btn primary" onclick="move(1)">${step===s.criteria.length-1?'Finalizar':'Siguiente →'}</button></div></div>`}
function markStudent(uid,v){let s=session();s.marks[step]??={};s.marks[step][uid]=v;save();render()}
function markGroup(v){let s=session();s.marks[step]={group:v};save();render()}
function move(d){let s=session();if(d>0&&marksFor(s,step).some(v=>v===null)){toast('Faltan estudiantes por evaluar en este criterio.');return}if(step+d>=s.criteria.length){go('results');return}step=Math.max(0,step+d);render();window.scrollTo(0,0)}
function scoreFor(s,student){let score=0,max=0,missing=0;let sections={};s.criteria.forEach((c,i)=>{let v=c.modalidad==='Grupal'?s.marks[i]?.group:s.marks[i]?.[student.uid];max+=c.maximo;if(!sections[c.seccion])sections[c.seccion]={score:0,max:0};sections[c.seccion].max+=c.maximo;if(v===undefined||v===null){missing++;return}let points=c.maximo*v/4;score+=points;sections[c.seccion].score+=points});return {score,max,missing,sections,grade:missing?null:grade(score,max)}}
function grade(points,max){let percent=max?points/max:0;let g=percent<.6?1+3*percent/.6:4+3*(percent-.6)/.4;return Math.max(1,Math.min(7,g))}
function fmt(n){return Number(n).toLocaleString('es-CL',{maximumFractionDigits:2})}function nota(n){return n===null?'Pendiente':n.toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1})}
function resultsHTML(){let s=session();if(!s)return `<div class="panel">No hay evaluación seleccionada.</div>`;let finished=s.students.every(x=>!scoreFor(s,x).missing);return `<div class="stack"><section class="panel"><button class="crumb" onclick="go('evaluate')">‹ Volver a los criterios</button><span class="eyebrow" style="display:block;margin-top:8px">Resultados del grupo</span><h1 class="heading">${esc(s.group)}</h1><p class="muted">${esc(s.courseName)} · ${esc(s.rubricName)} · exigencia 60 %</p>${!finished?`<div class="notice">La evaluación está incompleta. Las notas aparecerán cuando estén respondidos todos los indicadores.</div>`:`<div class="help">Evaluación completa. Puedes revisar y corregir cualquier criterio.</div>`}<div class="results-list">${s.students.map(x=>{let z=scoreFor(s,x);return `<article class="result"><div class="resulthead"><div class="rowwrap"><span class="emoji">${x.emoji}</span><strong>${esc(x.nombre)}</strong></div><span class="tag">${z.missing?`${z.missing} pendientes`:'Completa'}</span></div><div class="grid2" style="margin-top:12px"><div><div class="small">Puntaje</div><div class="score">${fmt(z.score)} / ${fmt(z.max)}</div></div><div><div class="small">Nota</div><div class="grade">${nota(z.grade)}</div></div></div>${Object.entries(z.sections).map(([name,v])=>`<div class="mini-row"><span>${esc(name)}</span><b>${fmt(v.score)} / ${fmt(v.max)}</b></div>`).join('')}<div class="actions"><button class="btn outline" onclick="copyReport('${x.uid}')">Copiar informe</button><button class="btn soft" onclick="emailReport('${x.uid}')">Preparar correo ↗</button></div></article>`}).join('')}</div><div class="actions"><button class="btn primary" onclick="step=0;go('evaluate')">Revisar criterios</button><button class="btn soft" onclick="exportSession('${s.id}',false)">↓ Resumen CSV</button><button class="btn soft" onclick="exportSession('${s.id}',true)">↓ Detalle CSV</button><button class="btn outline" onclick="go('home')">Ir al inicio</button></div></section></div>`}
function report(s,x){let z=scoreFor(s,x);return `Evaluación: ${s.rubricName}\nCurso: ${s.courseName}\nGrupo: ${s.group}\nEstudiante: ${x.nombre}\n\n`+s.criteria.map((c,i)=>{let v=c.modalidad==='Grupal'?s.marks[i]?.group:s.marks[i]?.[x.uid];return `${c.seccion} · ${c.criterio}\nNivel: ${v==null?'Pendiente':['Sin evidencia','Inicial','En desarrollo','Medianamente logrado','Logrado'][v]} · ${v==null?'-':fmt(c.maximo*v/4)}/${c.maximo} puntos (${c.modalidad})`}).join('\n\n')+`\n\nPuntaje final: ${fmt(z.score)}/${fmt(z.max)}\nNota (60 % exigencia): ${nota(z.grade)}`}
function copyReport(uid){let s=session(),x=s.students.find(x=>x.uid===uid);navigator.clipboard?.writeText(report(s,x)).then(()=>toast('Informe copiado.')).catch(()=>fallbackCopy(report(s,x)))}
function fallbackCopy(value){let a=document.createElement('textarea');a.value=value;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Informe copiado.')}function emailReport(uid){let s=session(),x=s.students.find(x=>x.uid===uid);if(!x.correo){toast('Este estudiante no tiene correo registrado.');return}let subject=`Evaluación: ${s.rubricName}`;location.href=`mailto:${encodeURIComponent(x.correo)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(report(s,x))}`}
function showModal(html){$('modalbody').innerHTML=html;$('modal').classList.remove('hidden')}function hideModal(){$('modal').classList.add('hidden')}
function viewCourse(cid){let c=byId(courses(),cid);showModal(`<h3>${esc(c.name)}</h3><p class="muted">${c.students.length} estudiantes · ${unique(c.students.map(s=>s.grupo)).length} grupos</p><div class="field"><label>Nombre del curso</label><input id="rename-course" value="${esc(c.name)}"></div><div style="max-height:45vh;overflow:auto;margin-top:14px">${c.students.map(s=>`<div class="item"><div><b>${esc(s.nombre)}</b><div class="small">Grupo ${esc(s.grupo)} · ${esc(s.correo)}</div></div></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="renameCourse('${cid}')">Guardar nombre</button><button class="btn soft" onclick="hideModal()">Cerrar</button></div>`)}
function renameCourse(cid){byId(courses(),cid).name=$('rename-course').value.trim()||'Curso';save();hideModal();render()}
function viewRubric(rid){let r=byId(rubrics(),rid);showModal(`<h3>${esc(r.name)}</h3><p class="muted">${r.criteria.length} criterios · ${maxScore(r)} puntos</p><div class="field"><label>Nombre de la pauta</label><input id="rename-rubric" value="${esc(r.name)}"></div><div class="rubric-list" style="max-height:44vh;overflow:auto;margin-top:12px">${r.criteria.map((c,i)=>`<div class="rubric-criterion"><b>${i+1}. ${esc(c.seccion)} · ${esc(c.modalidad)} · ${c.maximo} pts</b><div>${esc(c.criterio)}</div></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="renameRubric('${rid}')">Guardar nombre</button><button class="btn soft" onclick="hideModal()">Cerrar</button></div>`)}
function renameRubric(rid){byId(rubrics(),rid).name=$('rename-rubric').value.trim()||'Pauta';save();hideModal();render()}
function removeCourse(cid){if(!confirm('¿Eliminar el curso de la lista? Las evaluaciones históricas se conservarán.'))return;data.courses=data.courses.filter(c=>c.id!==cid);save();render()}
function removeRubric(rid){if(!confirm('¿Eliminar la pauta de la lista? Las evaluaciones históricas se conservarán.'))return;data.rubrics=data.rubrics.filter(r=>r.id!==rid);save();render()}
function parseCSV(str){str=str.replace(/^\uFEFF/,'');let first=str.split(/\r?\n/)[0],delim=first.includes(';')&&!first.includes(',')?';':',';let rows=[],row=[],cell='',quoted=false;for(let i=0;i<str.length;i++){let ch=str[i];if(ch==='"'){if(quoted&&str[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===delim&&!quoted){row.push(cell.trim());cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&str[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell.trim());if(row.some(Boolean))rows.push(row);if(!rows.length)return[];let keys=rows.shift().map(h=>h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,''));return rows.map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]||''])))}
function readCSV(e,fn){let f=e.target.files[0];if(!f)return;f.text().then(t=>fn(parseCSV(t),f.name)).catch(()=>toast('Error al leer el archivo.'));e.target.value=''}
function importCourse(e){readCSV(e,(rows,filename)=>{if(!rows.length||!rows.every(x=>x.nombre&&x.grupo)){toast('Se necesitan columnas Nombre y Grupo con datos.');return}let names=unique(rows.map(x=>x.curso||filename.replace(/\.csv$/i,'')));for(let name of names){let list=rows.filter(x=>(x.curso||filename.replace(/\.csv$/i,''))===name).map(x=>({nombre:x.nombre,grupo:x.grupo,correo:x.correo||x.mail||x.email||''}));let existing=courses().find(c=>c.name===name);if(existing){if(!confirm(`Ya existe el curso «${name}». ¿Reemplazar su nómina?`))continue;existing.students=list}else courses().push({id:id(),name,students:list})}save();render();toast('Curso(s) importado(s).')})}
function importRubric(e){readCSV(e,(rows,filename)=>{let criteria=rows.map(x=>({seccion:x.seccion||x.seccionarea||'General',criterio:x.criterio,modalidad:(x.modalidad||'').trim().toLowerCase()==='grupal'?'Grupal':'Individual',maximo:Number((x.puntajemaximo||'').replace(',','.'))}));if(!criteria.length||criteria.some((x,i)=>!rows[i].criterio||!['individual','grupal'].includes((rows[i].modalidad||'').toLowerCase().trim())||!(x.maximo>0))){toast('Revisa Criterio, Modalidad (Individual/Grupal) y PuntajeMaximo (>0).');return}rubrics().push({id:id(),name:filename.replace(/\.csv$/i,''),criteria});save();render();toast('Pauta importada correctamente.')})}
function csvText(rows){return '\uFEFF'+rows.map(r=>r.map(v=>{let s=String(v??'');return `"${s.replace(/"/g,'""')}"`}).join(',')).join('\r\n')}
function download(name,text,mime){let blob=new Blob([text],{type:mime||'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function downloadSample(which){let rows=which==='course'?[['Nombre','Grupo','Correo'],['Ana Pérez','Equipo 1','ana@ejemplo.cl'],['Luis Soto','Equipo 1','luis@ejemplo.cl'],['Eva Rojas','Equipo 2','eva@ejemplo.cl']]:[['Seccion','Criterio','Modalidad','PuntajeMaximo'],['Presentación','Explica el proyecto de forma clara','Individual',4],['Prototipo','El prototipo funciona correctamente','Grupal',8],['Prototipo','Demuestra el algoritmo utilizado','Grupal',4]];download(which==='course'?'ejemplo_curso.csv':'ejemplo_pauta.csv',csvText(rows))}
function exportSession(sid,detail){exportThese(data.sessions.filter(s=>s.id===sid),detail)}function exportResults(detail){exportThese(data.sessions,detail)}
function exportThese(sessions,detail){let rows;if(detail){rows=[['Curso','Grupo','Pauta','Nombre','Correo','Seccion','Criterio','Modalidad','Nivel 0-4','Puntos obtenidos','PuntajeMaximo']];sessions.forEach(s=>s.students.forEach(x=>s.criteria.forEach((c,i)=>{let v=c.modalidad==='Grupal'?s.marks[i]?.group:s.marks[i]?.[x.uid];rows.push([s.courseName,s.group,s.rubricName,x.nombre,x.correo,c.seccion,c.criterio,c.modalidad,v??'',v==null?'':fmt(c.maximo*v/4),c.maximo])})))}else{rows=[['Curso','Grupo','Pauta','Nombre','Correo','Puntaje','Máximo','Nota (60%)','Pendientes']];sessions.forEach(s=>s.students.forEach(x=>{let z=scoreFor(s,x);rows.push([s.courseName,s.group,s.rubricName,x.nombre,x.correo,fmt(z.score),fmt(z.max),z.grade===null?'':nota(z.grade),z.missing])}))}download(`evaluaciones_${detail?'detalle':'resumen'}.csv`,csvText(rows))}
function backup(){download('respaldo_evalua.json',JSON.stringify(data,null,2),'application/json')}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let d=JSON.parse(t);if(!Array.isArray(d.courses)||!Array.isArray(d.rubrics)||!Array.isArray(d.sessions))throw Error('Formato incorrecto');if(!confirm('¿Reemplazar todos los datos locales con este respaldo?'))return;data=d;save();go('home');toast('Respaldo restaurado.')}catch{toast('Este archivo no es un respaldo válido.')}});e.target.value=''}

/* Logo guardado solo en el navegador actual. */
function openLogoPicker(){document.getElementById('logo-upload').click()}
function setBrandLogo(src){const im=document.getElementById('brand-logo'),fallback=document.getElementById('logo-fallback');if(src){im.src=src;im.style.display='block';fallback.style.display='none'}else{im.removeAttribute('src');im.style.display='none';fallback.style.display='block'}}
function loadLogo(ev){const f=ev.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp','image/svg+xml'].includes(f.type)){toast('Elige una imagen PNG, JPG, WEBP o SVG.');return}if(f.size>2*1024*1024){toast('Usa un logo de menos de 2 MB.');return}const rd=new FileReader();rd.onload=()=>{try{localStorage.setItem('profeclau.logo.v2',rd.result);setBrandLogo(rd.result);toast('¡Logo de ProfeClau guardado!')}catch(e){toast('No se pudo guardar el logo; intenta con una imagen más liviana.')}};rd.readAsDataURL(f);ev.target.value=''}
try{setBrandLogo(localStorage.getItem('profeclau.logo.v2') || DEFAULT_PROFECLAU_LOGO)}catch(e){setBrandLogo(DEFAULT_PROFECLAU_LOGO)}
